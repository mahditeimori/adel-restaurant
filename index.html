<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adel Restaurant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap');

        :root {
            --cherry: #4a0f20;
            --cherry-light: #6b1a30;
            --cherry-dark: #2d0812;
            --black: #0a0a0a;
            --black-soft: #141414;
            --wood: #8b6f47;
            --wood-light: #b8976a;
            --cream: #f5e6c8;
            --white: #ffffff;
            --white-muted: #a0a0a0;
        }

        /* Light theme: the same brand hues over warm paper, so the landing
           page and the menu read as one restaurant in either mode. */
        [data-theme="light"] {
            --black: #f6f1e7;
            --wood: #6f5836;
            --wood-light: #8b6f47;
            --cream: #fffdf8;
            --cherry: #6b1a30;
            --cherry-light: #6b1a30;
            --cherry-dark: #4a0f20;
            --white: #1c1613;
            --white-muted: #5d5349;
        }

        [data-theme="light"] .luxury-frame { border-color: rgba(139, 111, 71, 0.45); }
        [data-theme="light"] .luxury-frame::before { border-color: rgba(139, 111, 71, 0.22); }
        [data-theme="light"] .corner::before,
        [data-theme="light"] .corner::after { background: var(--wood); }
        [data-theme="light"] .glow { background: radial-gradient(circle, rgba(184,151,106,.16) 0%, transparent 70%); }
        [data-theme="light"] .restaurant-name { text-shadow: none; }
        [data-theme="light"] .footer { border-top-color: rgba(139, 111, 71, 0.28); }
        [data-theme="light"] .btn-menu { color: #fffdf8; }
        [data-theme="light"] .btn-map:hover { color: #1c1613; }

        /* theme switch, shared with the menu page */
        .themes {
            position: fixed;
            top: 26px; left: 26px; z-index: 110;
            display: flex; gap: 2px; padding: 3px;
            background: var(--black); border: 1px solid var(--wood);
            border-radius: 999px;
            transition: background .4s;
        }
        .themes button {
            min-width: 44px; min-height: 44px;
            display: inline-flex; align-items: center; justify-content: center;
            background: transparent; border: 0; border-radius: 999px;
            color: var(--white-muted); cursor: pointer;
            transition: background .25s, color .25s;
        }
        .themes button svg { width: 17px; height: 17px; }
        .themes button:hover { color: var(--white); }
        .themes button[aria-pressed="true"] { background: var(--cherry); color: var(--cream); }
        .themes button:focus-visible { outline: 2px solid var(--wood-light); outline-offset: 2px; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--white);
            overflow-x: hidden;
        }

        /* Luxury wood-tone border frame */
        .luxury-frame {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border: 2px solid rgba(139, 111, 71, 0.6);
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
        }

        .luxury-frame::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 1px solid rgba(139, 111, 71, 0.3);
            border-radius: 16px;
        }

        /* Corner ornaments - wood tone */
        .corner {
            position: fixed;
            width: 36px;
            height: 36px;
            z-index: 101;
        }

        .corner-tl { top: 18px; left: 18px; }
        .corner-tr { top: 18px; right: 18px; }
        .corner-bl { bottom: 18px; left: 18px; }
        .corner-br { bottom: 18px; right: 18px; }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: var(--wood);
        }

        .corner-tl::before { width: 22px; height: 3px; top: 0; left: 0; }
        .corner-tl::after { width: 3px; height: 22px; top: 0; left: 0; }

        .corner-tr::before { width: 22px; height: 3px; top: 0; right: 0; }
        .corner-tr::after { width: 3px; height: 22px; top: 0; right: 0; }

        .corner-bl::before { width: 22px; height: 3px; bottom: 0; left: 0; }
        .corner-bl::after { width: 3px; height: 22px; bottom: 0; left: 0; }

        .corner-br::before { width: 22px; height: 3px; bottom: 0; right: 0; }
        .corner-br::after { width: 3px; height: 22px; bottom: 0; right: 0; }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo area */
        .logo-section {
            margin-bottom: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--wood);
            box-shadow: 0 0 40px rgba(139, 111, 71, 0.3), inset 0 0 20px rgba(0,0,0,0.3);
            margin-bottom: 28px;
        }

        .restaurant-name {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--cherry-light);
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(122, 37, 64, 0.4);
            line-height: 1.5;
        }

        .tagline {
            font-size: 14px;
            color: var(--wood-light);
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 18px;
        }

        /* Decorative divider - wood tone */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            gap: 14px;
            width: 100%;
        }

        .divider-line {
            width: 55px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--wood), transparent);
        }

        .divider-diamond {
            width: 7px;
            height: 7px;
            background: var(--wood);
            transform: rotate(45deg);
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 15px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px 28px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn-menu {
            background: linear-gradient(135deg, var(--cherry-light) 0%, var(--cherry-dark) 100%);
            color: var(--cream);
            box-shadow: 0 8px 28px rgba(92, 26, 46, 0.35);
        }

        .btn-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s;
        }

        .btn-menu:hover::before {
            left: 100%;
        }

        .btn-menu:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(92, 26, 46, 0.5);
        }

        .btn-map {
            background: transparent;
            color: var(--wood-light);
            border: 1px solid rgba(139, 111, 71, 0.5);
        }

        .btn-map:hover {
            background: rgba(139, 111, 71, 0.08);
            border-color: var(--wood-light);
            color: var(--cream);
            transform: translateY(-3px);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon svg {
            width: 22px;
            height: 22px;
        }

        /* Review nudge under the map button */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .review-nudge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--wood-light);
            letter-spacing: 0.3px;
            line-height: 1.6;
        }

        .review-nudge svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .nudge-wink {
            unicode-bidi: isolate;
            direction: ltr;
            /* Latin-first stack: Vazirmatn renders ';' with an Arabic-style
               glyph, so pin this punctuation to a font that draws it Latin. */
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            font-size: 15px;
            line-height: 1;
        }

        /* Footer */
        .footer {
            margin-top: 45px;
            padding-top: 22px;
            border-top: 1px solid rgba(139, 111, 71, 0.25);
            width: 100%;
        }

        .footer-text {
            font-size: 13px;
            color: var(--wood);
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Subtle ambient glow - cherry tone */
        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 26, 46, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 { top: -120px; right: -120px; }
        .glow-2 { bottom: -120px; left: -120px; }

        /* Responsive scaling */
        @media (max-height: 700px) {
            body {
                justify-content: flex-start;
                padding-top: 40px;
            }
            .logo-image {
                width: 120px;
                height: 120px;
                margin-bottom: 20px;
            }
            .restaurant-name {
                font-size: 30px;
            }
            .logo-section {
                margin-bottom: 25px;
            }
            .divider {
                margin: 20px 0;
            }
            .btn {
                padding: 16px 24px;
                font-size: 16px;
            }
            .footer {
                margin-top: 30px;
                padding-top: 18px;
            }
        }

        @media (max-height: 600px) {
            body {
                justify-content: flex-start;
                padding-top: 30px;
            }
            .logo-image {
                width: 90px;
                height: 90px;
                margin-bottom: 15px;
            }
            .restaurant-name {
                font-size: 24px;
            }
            .logo-section {
                margin-bottom: 18px;
            }
            .divider {
                margin: 15px 0;
            }
            .btn {
                padding: 13px 20px;
                font-size: 15px;
            }
            .buttons {
                gap: 12px;
            }
            .footer {
                margin-top: 22px;
                padding-top: 14px;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 440px;
            }
            .logo-image {
                width: 180px;
                height: 180px;
            }
            .restaurant-name {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="themes" role="group" aria-label="پوسته">
        <button type="button" data-set-theme="light" aria-pressed="false" title="روشن" aria-label="پوسته روشن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
            </svg>
        </button>
        <button type="button" data-set-theme="dark" aria-pressed="true" title="تیره" aria-label="پوسته تیره">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/>
            </svg>
        </button>
        <button type="button" data-set-theme="system" aria-pressed="false" title="خودکار" aria-label="پوسته خودکار">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8"/>
            </svg>
        </button>
    </div>

    <!-- Luxury frame -->
    <div class="luxury-frame"></div>

    <!-- Corner ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Ambient glow -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="logo-section">
            <img src="logo.png" alt="Adel Restaurant" class="logo-image" />
            <h1 class="restaurant-name">چلوگوشت آقای عادل</h1>
            <p class="tagline">طعم اصیل، کیفیت بی‌نظیر</p>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>

        <div class="buttons">
            <a href="menu.html" class="btn btn-menu">
                <div class="btn-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                مشاهده منو
            </a>

            <div class="btn-group">
                <a href="https://maps.app.goo.gl/ZtKnQoNZQeCq8vVX8" class="btn btn-map" target="_blank">
                    <div class="btn-icon">
                        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </div>
                    نظرات و موقعیت مکانی
                </a>
                <p class="review-nudge">
                    <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    <span>نظر دادن یادتون نره</span>
                    <span class="nudge-wink">;)</span>
                </p>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">Adel Restaurant</p>
        </div>
    </div>

<script>
/* Shared theme controller. Same storage key as menu.html, so the visitor's
   choice follows them from the landing page into the menu and back. */
(function () {
  "use strict";
  var root = document.documentElement;
  var KEY = "adel-theme";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
  if (saved === "light" || saved === "dark" || saved === "system") {
    root.setAttribute("data-theme", saved);
  }

  function paint() {
    var now = root.getAttribute("data-theme");
    var btns = document.querySelectorAll("[data-set-theme]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed",
        String(btns[i].getAttribute("data-set-theme") === now));
    }
  }

  var btns = document.querySelectorAll("[data-set-theme]");
  for (var i = 0; i < btns.length; i++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.getAttribute("data-set-theme");
        root.setAttribute("data-theme", v);
        try { localStorage.setItem(KEY, v); } catch (e) { /* ignore */ }
        paint();
      });
    })(btns[i]);
  }
  paint();
})();
</script>
</body>
</html>
