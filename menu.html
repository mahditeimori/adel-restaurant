<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="description" content="منوی رستوران چلوگوشت آقای عادل">
<title>منو | چلوگوشت آقای عادل</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* =============================================================================
   1. TOKENS
   One palette, two modes. Every colour on the page resolves to a token here,
   which is what keeps the harmony intact when the theme flips.
   Dark mode is the brand default: black ground, dark cherry, antique wood.
   Light mode is the same hues over warm paper, not a different identity.
   ========================================================================== */
:root {
  /* brand hues - fixed across both modes */
  --cherry:       #6b1a30;
  --cherry-deep:  #2d0812;
  --wood:         #8b6f47;
  --wood-light:   #b8976a;
  --cream:        #f5e6c8;

  /* type scale */
  --fs-hero:  clamp(30px, 8vw, 46px);
  --fs-h2:    clamp(23px, 5.6vw, 30px);
  --fs-item:  clamp(16px, 4.2vw, 19px);
  --fs-body:  clamp(14px, 3.6vw, 15px);
  --fs-small: 12px;

  --radius:   18px;
  --radius-sm: 12px;
  --tap:      48px;
  --wrap:     760px;

  --ease: cubic-bezier(.22, .61, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

/* --- dark (default) --- */
:root, [data-theme="dark"] {
  --bg:          #0b0a09;
  --bg-deep:     #050505;
  --surface:     #131211;
  --surface-2:   #1c1a18;
  --line:        rgba(184, 151, 106, .20);
  --line-strong: rgba(184, 151, 106, .45);
  --text:        #f4efe7;
  --text-dim:    #a99f94;
  --text-faint:  #948a7e;          /* 4.6:1 on --bg, clears 4.5 for small text */
  --accent:      var(--wood-light);
  --accent-ink:  var(--cream);
  --heading:     #e58aa4;          /* lifted cherry, 5.6:1 on --bg */
  --chip:        rgba(107, 26, 48, .30);
  --chip-line:   rgba(107, 26, 48, .65);
  --chip-ink:    #f4efe7;          /* light ink on the dark chip fill */
  --shadow:      0 18px 50px rgba(0, 0, 0, .55);
  --hero-veil:   radial-gradient(110% 78% at 50% 0%, rgba(107,26,48,.40), transparent 62%);
  --art-tint:    invert(1) sepia(.30) saturate(2.2) hue-rotate(338deg) brightness(1.15);
  --art-opacity: .78;
  --art-line:    rgba(240, 224, 160, .95);
  --art-fill:    rgba(201, 168, 76, .30);
  --art-glow:    rgba(201, 168, 76, .34);
}

/* --- light --- */
[data-theme="light"] {
  --bg:          #f6f1e7;
  --bg-deep:     #ece4d6;
  --surface:     #fffdf8;
  --surface-2:   #f2ead9;
  --line:        rgba(139, 111, 71, .24);
  --line-strong: rgba(139, 111, 71, .50);
  --text:        #1c1613;
  --text-dim:    #574e45;
  --text-faint:  #6b6157;          /* 5.6:1 on --bg */
  --accent:      #6f5836;          /* darker wood, 5.4:1 on paper */
  --accent-ink:  #fffdf8;
  --heading:     #7d1e38;
  --chip:        rgba(107, 26, 48, .12);
  --chip-line:   rgba(107, 26, 48, .34);
  --chip-ink:    #6d1b33;          /* chip label, needs its own dark ink */
  --shadow:      0 18px 44px rgba(74, 56, 30, .14);
  --hero-veil:   radial-gradient(110% 78% at 50% 0%, rgba(184,151,106,.38), transparent 62%);
  --art-tint:    sepia(.34) saturate(1.5) hue-rotate(338deg) brightness(.86) contrast(1.1);
  --art-opacity: .72;
  --art-line:    rgba(48, 30, 16, .90);
  --art-fill:    rgba(107, 26, 48, .26);
  --art-glow:    rgba(139, 111, 71, .30);
}

/* --- system: follow the OS until the visitor picks a side --- */
@media (prefers-color-scheme: light) {
  [data-theme="system"] {
    --bg:          #f6f1e7;
    --bg-deep:     #ece4d6;
    --surface:     #fffdf8;
    --surface-2:   #f2ead9;
    --line:        rgba(139, 111, 71, .24);
    --line-strong: rgba(139, 111, 71, .50);
    --text:        #1c1613;
    --text-dim:    #574e45;
    --text-faint:  #6b6157;
    --accent:      #6f5836;
    --accent-ink:  #fffdf8;
    --heading:     #7d1e38;
    --chip:        rgba(107, 26, 48, .12);
    --chip-line:   rgba(107, 26, 48, .34);
    --chip-ink:    #6d1b33;
    --shadow:      0 18px 44px rgba(74, 56, 30, .14);
    --hero-veil:   radial-gradient(110% 78% at 50% 0%, rgba(184,151,106,.38), transparent 62%);
    --art-tint:    sepia(.34) saturate(1.5) hue-rotate(338deg) brightness(.86) contrast(1.1);
    --art-opacity: .72;
    --art-line:    rgba(48, 30, 16, .90);
    --art-fill:    rgba(107, 26, 48, .26);
    --art-glow:    rgba(139, 111, 71, .30);
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 0;
}

body {
  font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-body);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  /* Both axes are clipped deliberately. The 3D hero art is wider than the
     viewport by design; in an RTL document a left-side overhang moves the
     scroll origin and shifts every centred element off-screen. */
  overflow-x: clip;
  transition: background .5s var(--ease), color .5s var(--ease);
  padding-bottom: env(safe-area-inset-bottom);
}

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =============================================================================
   2. HERO - layered 3D cooking scenes
   Depth comes from real translateZ planes inside a preserve-3d stage, so the
   composition rotates in perspective rather than sliding in 2D. Each plane is
   its own SVG, separated in Z, with a blur on the rearmost plane for
   depth of field. Scenes cross-fade with a slight push so the swap reads as
   a cut in a film, not a slideshow.
   ========================================================================== */
.hero {
  position: relative;
  height: clamp(300px, 46vh, 420px);
  overflow: hidden;
  background: var(--bg-deep);
  /* A generous perspective flattens the rotation, so the stage keeps close
     to its own bounds and the composition stays centred. */
  perspective: 1400px;
  perspective-origin: 50% 40%;
  border-bottom: 1px solid var(--line);
}

.hero-veil {
  position: absolute; inset: 0; z-index: 4;
  background: var(--hero-veil);
  pointer-events: none;
}

.stage {
  /* Sized so the full composition fits the hero once the 3D rotation has
     inflated its bounding box. Raising this pushes the title off-screen. */
  --plane: clamp(200px, 56vw, 300px);
  position: absolute;
  /* The stage is oversized on purpose so the 3D planes have room to spread.
     .hero clips it, and the extra width is offset symmetrically so nothing
     overhangs to one side - in RTL an overhang shifts the scroll origin and
     drags the whole page sideways. */
  inset: 0 -14%;
  transform-style: preserve-3d;
  transform: rotateX(5deg) rotateY(-14deg);
  animation: yaw 34s linear infinite;
  will-change: transform;
}

@keyframes yaw {
  0%   { transform: rotateX(5deg) rotateY(-14deg); }
  50%  { transform: rotateX(2deg) rotateY(11deg); }
  100% { transform: rotateX(5deg) rotateY(-14deg); }
}

.scene {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  opacity: 0;
  transition: opacity 1.5s var(--ease), transform 1.9s var(--ease-out);
  will-change: opacity, transform;
}
.scene.is-on {
  opacity: 1;
  transform: translateZ(0);
}
.scene:not(.is-on) { transform: translateZ(-90px) scale(1.05); }

.plane {
  position: absolute;
  left: 50%; top: 26%;
  width: var(--plane); height: var(--plane);
  margin: calc(var(--plane) / -2) 0 0 calc(var(--plane) / -2);
  transform-style: preserve-3d;
  will-change: transform, opacity;
}
.plane svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* The art is monochrome line work, drawn directly in the brand ink token for
   the active theme - light ink on dark, dark ink on light. No filter stack:
   grayscale() over already-coloured ink drains the saturation, and a sepia
   pass afterwards has nothing left to tint. */
.plane svg { opacity: var(--art-opacity); }

/* each plane sits at its own depth, so the stage rotation reads as depth
   rather than a flat pan */
.p-back  { transform: translate3d(-13%, 8%, -150px) scale(1.26); }
.p-mid   { transform: translate3d(0, 0, 0) scale(1); }
.p-front { transform: translate3d(11%, -8%, 105px) scale(.90); }

/* independent float so the planes breathe against each other */
.p-back  svg { animation: floatA 15s ease-in-out infinite; }
.p-mid   svg { animation: floatB 11s ease-in-out infinite; }
.p-front svg { animation: floatC 8.5s ease-in-out infinite; }

@keyframes floatA { 0%,100% { transform: translateY(-8px) } 50% { transform: translateY(10px) } }
@keyframes floatB { 0%,100% { transform: translateY(6px) rotate(-1deg) } 50% { transform: translateY(-9px) rotate(1.5deg) } }
@keyframes floatC { 0%,100% { transform: translateY(-5px) scale(1) } 50% { transform: translateY(7px) scale(1.04) } }

.hero-inner {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 0 20px 26px;
  text-align: center;
  background: linear-gradient(to top, var(--bg) 1%, color-mix(in srgb, var(--bg) 55%, transparent) 22%, transparent 52%);
}

.hero-logo {
  width: 62px; height: 62px; border-radius: 50%;
  object-fit: cover; border: 1px solid var(--line-strong);
  margin-bottom: 12px; background: var(--surface);
}
.hero-name {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: var(--fs-hero); font-weight: 700;
  color: var(--text); line-height: 1.45;
}
.hero-sub {
  margin-top: 6px; font-size: var(--fs-small);
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--accent); direction: ltr;
}
.hero-tag {
  margin-top: 10px; font-size: 13px; color: var(--text-dim);
}

/* =============================================================================
   3. CHROME - back link, theme switch, sticky category nav
   ========================================================================== */
.bar {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
  transition: background .5s var(--ease), border-color .5s var(--ease);
}

.bar-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 9px 0;
}

.back {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: var(--tap); padding: 0 6px;
  color: var(--text-dim); text-decoration: none; font-size: 14px;
  transition: color .2s;
}
.back:hover { color: var(--text); }
.back svg { width: 18px; height: 18px; flex-shrink: 0; }

/* theme switch */
.themes {
  display: flex; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px;
}
.themes button {
  min-width: var(--tap); min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-radius: 999px;
  color: var(--text-faint); cursor: pointer;
  transition: background .25s var(--ease), color .25s var(--ease);
}
.themes button svg { width: 18px; height: 18px; }
.themes button:hover { color: var(--text); }
.themes button[aria-pressed="true"] {
  background: var(--cherry); color: var(--cream);
}
.themes button:focus-visible { outline: 2px solid var(--wood-light); outline-offset: 2px; }

.catnav {
  display: flex; gap: 7px; overflow-x: auto;
  padding: 2px 0 10px;
  scrollbar-width: none; -ms-overflow-style: none;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.catnav::-webkit-scrollbar { display: none; }
.catnav a {
  flex-shrink: 0; scroll-snap-align: start;
  min-height: var(--tap); display: inline-flex; flex-direction: column;
  justify-content: center; gap: 1px;
  padding: 6px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text-dim); text-decoration: none;
  white-space: nowrap; line-height: 1.35;
  transition: color .25s, border-color .25s, background .25s;
}
.catnav a b { font-size: 10px; font-weight: 400; opacity: .65; direction: ltr; }
.catnav a:hover { color: var(--text); border-color: var(--line-strong); }
.catnav a.active {
  background: var(--cherry); border-color: var(--cherry);
  color: var(--cream);
}
.catnav a.active b { opacity: .8; }
.catnav a:focus-visible, .back:focus-visible { outline: 2px solid var(--wood-light); outline-offset: 3px; }

/* =============================================================================
   4. MENU
   ========================================================================== */
main { padding: 6px 0 40px; }
section { scroll-margin-top: 120px; padding-top: 40px; }

.sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.sec-head h2 {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: var(--fs-h2); font-weight: 700;
  /* the heading is large display text, so 3:1 is the bar; the cherry on the
     near-black ground only reaches 1.71:1, so dark mode uses a lifted tint */
  color: var(--heading);
  white-space: nowrap;
}
.sec-head .en {
  font-size: 11px; color: var(--text-faint);
  letter-spacing: 2px; text-transform: uppercase; direction: ltr;
}
.sec-head .rule { flex: 1; height: 1px; background: var(--line); }

ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

.item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 17px;
  transition: border-color .3s var(--ease), background .3s var(--ease),
              transform .3s var(--ease), box-shadow .3s var(--ease);
}
.item:hover {
  border-color: var(--line-strong); background: var(--surface-2);
  transform: translateY(-2px); box-shadow: var(--shadow);
}
.item:focus-visible { outline: 2px solid var(--wood-light); outline-offset: 2px; }

.item-top { display: flex; align-items: baseline; gap: 12px; }
.item-name { font-size: var(--fs-item); font-weight: 600; flex: 1; min-width: 0; }
.item-price {
  font-size: calc(var(--fs-item) - 1px); font-weight: 700;
  color: var(--accent); white-space: nowrap; direction: ltr;
  font-variant-numeric: tabular-nums;
}
.item-desc { margin-top: 5px; font-size: 14px; color: var(--text-dim); line-height: 1.85; }

.item-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font-size: 11px; padding: 3px 10px; border-radius: 999px;
  background: var(--chip); border: 1px solid var(--chip-line); color: var(--chip-ink);
}
.chip.out { background: transparent; border-color: var(--line-strong); color: var(--text-faint); }
.item.sold { opacity: .5; }
.item.sold .item-name { text-decoration: line-through; }

/* =============================================================================
   5. FOOTER
   ========================================================================== */
footer {
  margin-top: 46px; padding: 30px 0 38px;
  border-top: 1px solid var(--line); text-align: center;
}
footer p { font-size: 13px; color: var(--text-faint); }
footer .en { margin-top: 7px; font-size: 11px; letter-spacing: 3px; color: var(--wood); direction: ltr; text-transform: uppercase; }

/* =============================================================================
   6. SCROLL REVEAL - transform + opacity only, so it stays on the compositor
   ========================================================================== */
.reveal { opacity: 0; transform: translate3d(0, 18px, 0); }
.reveal.in {
  opacity: 1; transform: none;
  transition: opacity .55s var(--ease-out), transform .55s var(--ease-out);
}
.reveal.d1 { transition-delay: .06s; }
.reveal.d2 { transition-delay: .12s; }
.reveal.d3 { transition-delay: .18s; }
.reveal.d4 { transition-delay: .24s; }
.reveal.d5 { transition-delay: .30s; }

/* =============================================================================
   7. RESPONSIVE
   ========================================================================== */
@media (min-width: 640px) {
  .wrap { padding: 0 26px; }
  ul { gap: 12px; }
  .item { padding: 18px 22px; }
  section { padding-top: 48px; }
}
/* very small phones: keep the hero from eating the screen */
@media (max-height: 620px) {
  .hero { height: clamp(230px, 38vh, 300px); }
  .hero-logo { width: 50px; height: 50px; margin-bottom: 8px; }
}
@media (min-width: 1024px) {
  .wrap { padding: 0 32px; }
}

/* =============================================================================
   8. REDUCED MOTION - the art still shows, it just stops moving
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
  .stage { transform: rotateX(4deg) rotateY(-10deg); }
  .scene { opacity: 0; }
  .scene.is-on { opacity: 1; transform: none; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<!-- ============================ HERO ============================ -->
<div class="hero" aria-hidden="true">
  <div class="stage" id="stage"></div>
  <div class="hero-veil"></div>
  <div class="hero-inner">
    <img class="hero-logo" src="logo.png" alt="">
    <h1 class="hero-name">چلوگوشت آقای عادل</h1>
    <p class="hero-sub">Adel Restaurant</p>
    <p class="hero-tag">از دل آشپزخانه، برای سفره شما</p>
  </div>
</div>

<!-- ============================ BAR ============================ -->
<header class="bar">
  <div class="wrap">
    <div class="bar-top">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18l6-6-6-6"/>
        </svg>
        بازگشت
      </a>

      <div class="themes" role="group" aria-label="پوسته">
        <button type="button" data-set-theme="light" aria-pressed="false" title="روشن" aria-label="پوسته روشن">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
          </svg>
        </button>
        <button type="button" data-set-theme="dark" aria-pressed="true" title="تیره" aria-label="پوسته تیره">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/>
          </svg>
        </button>
        <button type="button" data-set-theme="system" aria-pressed="false" title="خودکار" aria-label="پوسته خودکار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="catnav" id="catnav" aria-label="دسته‌بندی‌ها"></nav>
  </div>
</header>

<main>
  <div class="wrap" id="menu"></div>
</main>

<footer>
  <div class="wrap">
    <p>موجودی و قیمت‌ها ممکن است تغییر کند</p>
    <p class="en">Adel Restaurant</p>
  </div>
</footer>

<script src="menu-data.js"></script>
<script>
(function () {
  "use strict";

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- theme: light / dark / system, remembered ---------- */
  var root = document.documentElement;
  var KEY = "adel-theme";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
  if (saved === "light" || saved === "dark" || saved === "system") root.setAttribute("data-theme", saved);

  function paintButtons() {
    var now = root.getAttribute("data-theme");
    var btns = document.querySelectorAll("[data-set-theme]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-set-theme") === now));
    }
  }
  var tbtns = document.querySelectorAll("[data-set-theme]");
  for (var i = 0; i < tbtns.length; i++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.getAttribute("data-set-theme");
        root.setAttribute("data-theme", v);
        try { localStorage.setItem(KEY, v); } catch (e) { /* ignore */ }
        paintButtons();
      });
    })(tbtns[i]);
  }
  paintButtons();

  /* ---------- the 3D cooking scenes ----------
     Each scene is three SVG planes at different Z. The art is drawn
     monochrome and tinted by CSS, so it sits inside the brand palette in
     every theme instead of fighting it. */
  var SCENES = [
    /* 1. the sear - pan over flame, the moment meat hits iron */
    {
      id: "sear",
      back: '<svg viewBox="0 0 300 300"><defs><radialGradient id="g1a">' +
            '<stop offset="0" stop-color="var(--art-glow)" stop-opacity=".95"/>' +
            '<stop offset="1" stop-color="var(--art-glow)" stop-opacity="0"/></radialGradient></defs>' +
            '<circle cx="150" cy="235" r="150" fill="url(#g1a)"/></svg>',
      mid: '<svg viewBox="0 0 300 300">' +
           '<g fill="none" stroke="var(--art-line)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">' +
           '<path d="M56 188h188"/><path d="M78 190h144"/>' +
           '<path d="M84 190a66 32 0 0 0 132 0"/></g>' +
           '<g fill="var(--art-fill)"><ellipse cx="150" cy="180" rx="56" ry="14"/>' +
           '<ellipse cx="124" cy="174" rx="22" ry="8"/><ellipse cx="176" cy="176" rx="24" ry="8"/></g>' +
           '<g stroke="var(--art-line)" stroke-width="5" stroke-linecap="round" opacity=".7">' +
           '<path d="M104 138c-12-14 8-24 0-40"/><path d="M150 128c-14-18 10-30 0-50"/>' +
           '<path d="M196 138c-12-14 8-24 0-40"/></g></svg>',
      front: '<svg viewBox="0 0 300 300"><g fill="var(--art-fill)">' +
             '<path d="M108 268c-9-18 5-29 0-45 11 9 20 5 24-7 7 20 29 25 25 52z"/>' +
             '<path d="M150 276c-11-22 7-35 0-55 13 11 24 7 28-9 9 24 33 31 26 64z" opacity=".85"/>' +
             '<path d="M196 268c-7-13 5-22 0-33 9 7 15 3 17-5 5 15 19 20 15 38z" opacity=".7"/>' +
             '</g></svg>'
    },
    /* 2. the simmer - pot on a slow boil, lid just lifted */
    {
      id: "simmer",
      back: '<svg viewBox="0 0 300 300"><defs><radialGradient id="g2a">' +
            '<stop offset="0" stop-color="var(--art-glow)" stop-opacity=".85"/>' +
            '<stop offset="1" stop-color="var(--art-glow)" stop-opacity="0"/></radialGradient></defs>' +
            '<circle cx="150" cy="150" r="150" fill="url(#g2a)"/></svg>',
      mid: '<svg viewBox="0 0 300 300">' +
           '<g fill="none" stroke="var(--art-line)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">' +
           '<path d="M80 176h140v44a18 18 0 0 1-18 18H98a18 18 0 0 1-18-18z"/>' +
           '<path d="M70 176h160"/><path d="M116 160h68" opacity=".75"/></g>' +
           '<circle cx="150" cy="150" r="9" fill="var(--art-fill)"/>' +
           '<path d="M100 206h100" stroke="var(--art-line)" stroke-width="5" opacity=".45" stroke-linecap="round" fill="none"/></svg>',
      front: '<svg viewBox="0 0 300 300">' +
             '<g fill="none" stroke="var(--art-line)" stroke-width="8" stroke-linecap="round" opacity=".9">' +
             '<path d="M118 138c-16-20 12-32 0-54"/><path d="M150 126c-18-24 14-38 0-64"/>' +
             '<path d="M182 138c-16-20 12-32 0-54"/></g></svg>'
    },
    /* 3. the pass - domed rice on the plate, the garnish scatter */
    {
      id: "plate",
      back: '<svg viewBox="0 0 300 300"><defs><radialGradient id="g3a">' +
            '<stop offset="0" stop-color="var(--art-glow)" stop-opacity=".8"/>' +
            '<stop offset="1" stop-color="var(--art-glow)" stop-opacity="0"/></radialGradient></defs>' +
            '<circle cx="150" cy="196" r="150" fill="url(#g3a)"/></svg>',
      mid: '<svg viewBox="0 0 300 300">' +
           '<g fill="none" stroke="var(--art-line)" stroke-linecap="round">' +
           '<ellipse cx="150" cy="204" rx="100" ry="28" stroke-width="9"/>' +
           '<ellipse cx="150" cy="199" rx="72" ry="19" stroke-width="5" opacity=".5"/></g>' +
           '<path d="M98 198c0-27 23-48 52-48s52 21 52 48z" fill="var(--art-fill)"/>' +
           '<path d="M120 176c8-14 22-22 30-22" stroke="var(--art-line)" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/></svg>',
      front: '<svg viewBox="0 0 300 300">' +
             '<g fill="var(--art-fill)">' +
             '<ellipse cx="128" cy="234" rx="6" ry="3.5"/><ellipse cx="172" cy="240" rx="6" ry="3.5"/>' +
             '<ellipse cx="150" cy="250" rx="6" ry="3.5"/><ellipse cx="116" cy="252" rx="5" ry="3"/>' +
             '<ellipse cx="186" cy="256" rx="5" ry="3"/></g>' +
             '<g fill="none" stroke="var(--art-line)" stroke-width="6" stroke-linecap="round" opacity=".8">' +
             '<path d="M134 128c-14-18 9-28 0-46"/><path d="M168 128c-14-18 9-28 0-46"/></g></svg>'
    }
  ];

  var stage = document.getElementById("stage");
  var sceneEls = SCENES.map(function (s, i) {
    var el = document.createElement("div");
    el.className = "scene" + (i === 0 ? " is-on" : "");
    el.setAttribute("data-scene", s.id);
    ["back", "mid", "front"].forEach(function (k) {
      var p = document.createElement("div");
      p.className = "plane p-" + k;
      p.innerHTML = s[k];
      el.appendChild(p);
    });
    stage.appendChild(el);
    return el;
  });

  if (!reduce && sceneEls.length > 1) {
    var idx = 0;
    setInterval(function () {
      sceneEls[idx].classList.remove("is-on");
      idx = (idx + 1) % sceneEls.length;
      sceneEls[idx].classList.add("is-on");
    }, 6200);
  }

  /* ---------- menu ---------- */
  var menuEl = document.getElementById("menu");
  var navEl  = document.getElementById("catnav");

  var FA = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  function toFa(v) { return String(v).replace(/\d/g, function (d) { return FA[+d]; }); }
  function money(v) {
    return toFa(Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "٬"));
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  if (!Array.isArray(MENU) || !MENU.length) {
    menuEl.appendChild(el("p", "item-desc", "منو هنوز اضافه نشده است."));
    return;
  }

  var sections = [];

  MENU.forEach(function (cat) {
    var sec = el("section");
    sec.id = "cat-" + cat.id;

    var head = el("div", "sec-head reveal");
    head.appendChild(el("h2", null, cat.name));
    if (cat.en) head.appendChild(el("span", "en", cat.en));
    head.appendChild(el("span", "rule"));
    sec.appendChild(head);

    var ul = el("ul");
    cat.items.forEach(function (dish, i) {
      var li = el("li", "item reveal d" + Math.min(5, (i % 5) + 1));
      if (dish.unavailable) li.classList.add("sold");
      li.tabIndex = 0;

      var top = el("div", "item-top");
      top.appendChild(el("span", "item-name", dish.name));
      top.appendChild(el("span", "item-price", money(dish.price) + " تومان"));
      li.appendChild(top);

      if (dish.desc) li.appendChild(el("p", "item-desc", dish.desc));

      if (dish.tag || dish.unavailable) {
        var meta = el("div", "item-meta");
        if (dish.tag) meta.appendChild(el("span", "chip", dish.tag));
        if (dish.unavailable) meta.appendChild(el("span", "chip out", "ناموجود"));
        li.appendChild(meta);
      }
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    menuEl.appendChild(sec);
    sections.push(sec);

    var link = el("a");
    link.href = "#cat-" + cat.id;
    link.appendChild(el("span", null, cat.name));
    if (cat.en) link.appendChild(el("b", null, cat.en));
    navEl.appendChild(link);
  });

  /* ---------- reveal on scroll ---------- */
  var reveals = document.querySelectorAll(".reveal");
  if (reduce || !("IntersectionObserver" in window)) {
    for (var i = 0; i < reveals.length; i++) reveals[i].classList.add("in");
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.04 });
    for (var j = 0; j < reveals.length; j++) io.observe(reveals[j]);
  }

  /* ---------- active category ---------- */
  var links = [].slice.call(navEl.querySelectorAll("a"));
  if ("IntersectionObserver" in window) {
    var nav = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) {
          a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id);
        });
      });
    }, { rootMargin: "-150px 0px -62% 0px", threshold: 0 });
    sections.forEach(function (s) { nav.observe(s); });
  }

  /* ---------- keep anchor jumps clear of the sticky bar ---------- */
  var bar = document.querySelector(".bar");
  function sync() {
    var h = (bar ? bar.offsetHeight : 120) + 16;
    document.documentElement.style.setProperty("--bar-h", h + "px");
    sections.forEach(function (s) { s.style.scrollMarginTop = h + "px"; });
  }
  sync();
  window.addEventListener("resize", sync);
  window.addEventListener("load", sync);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
})();
</script>
</body>
</html>
